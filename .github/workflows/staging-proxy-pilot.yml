name: Staging RPC proxy pilot

on:
  push:
    branches: [staging-tvl-pilot]
    paths:
      - .github/workflows/staging-proxy-pilot.yml
      - src/pilot/**
      - tests/staging-proxy-pilot.test.ts

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-tvl-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify direct fallback is rejected
        run: npm test -- tests/staging-proxy-pilot.test.ts
      - name: Run full TVL extraction through staging
        run: node --import tsx --import ./src/pilot/setup.ts src/index.ts
        env:
          STAGING_RPC_PROXY_TOKEN: ${{ secrets.STAGING_RPC_PROXY_TOKEN }}
          THEGRAPH_API_KEY: ${{ secrets.THEGRAPH_API_KEY }}
          NODE_ENV: production
          OUTPUT_DIR: pilot-output
      - name: Verify full extraction coverage
        run: node --import tsx src/pilot/check-output.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: staging-proxy-extraction
          path: pilot-output/tvl.json
          if-no-files-found: error
          retention-days: 7
